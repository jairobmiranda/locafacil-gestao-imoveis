<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#305cde" />
    <title>Sem conexão · LocaFácil</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #ffffff;
        color: #1c2333;
      }

      main {
        max-width: 24rem;
        text-align: center;
      }

      img {
        width: 4.5rem;
        height: 4.5rem;
      }

      h1 {
        font-size: 1.25rem;
        margin: 1.5rem 0 0.5rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: #5b6478;
        line-height: 1.5;
      }

      button {
        font: inherit;
        padding: 0.6rem 1.4rem;
        border: 1px solid #2749b4;
        border-radius: 0.6rem;
        background: #305cde;
        color: #ffffff;
        cursor: pointer;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0d12;
          color: #e7ebf5;
        }

        p {
          color: #98a2b8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icone-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>Não foi possível carregar a página. Verifique a internet e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
