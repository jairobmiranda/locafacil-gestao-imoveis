services:
  mariadb:
    image: mariadb:11.4
    container_name: locafacil-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: locafacil
      MARIADB_USER: locafacil
      MARIADB_PASSWORD: locafacil
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  # Armazenamento S3 (anexos e fotos de vistoria). Mesma imagem e mesmo garage.toml do
  # CapRover. Na primeira subida o próprio Garage monta o layout e cria a chave e o bucket.
  # Credenciais só de desenvolvimento: são as mesmas S3_* do .env.example.
  garage:
    build:
      context: .
      dockerfile: docker/Dockerfile.garage
    container_name: locafacil-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: a0ff6673643a14c59fbf1cdd66b70cef2412bbd326569433e17f6f621b1b3caa
      GARAGE_DEFAULT_ACCESS_KEY: GK55d6550ccb629d52f0d6dc01
      GARAGE_DEFAULT_SECRET_KEY: fd90cb9f1088634a9e4843951bf8163b379b9c0e301d1ed7d12d13a9f956a72f
      GARAGE_DEFAULT_BUCKET: locafacil
    ports:
      - '3900:3900'
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      # A imagem não tem shell: o healthcheck chama o binário direto.
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
  garage_meta:
  garage_data:
