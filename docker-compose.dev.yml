services:
  mariadb:
    image: mariadb:11.4
    container_name: locafacil-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: locafacil
      MARIADB_USER: locafacil
      MARIADB_PASSWORD: locafacil
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: locafacil-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: locafacil
      MINIO_ROOT_PASSWORD: locafacil123
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Cria o bucket na primeira subida e encerra.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 locafacil locafacil123 &&
      mc mb --ignore-existing local/locafacil &&
      exit 0
      "

volumes:
  mariadb_data:
  minio_data:
